name: CI

# Pull requests and main: build, test, bundle (ad-hoc signed) and upload the DMG.
# Tagged releases (sign, notarise, publish) live in release.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app and DMG
        run: VERSION="0.1.0-dev.${{ github.run_number }}" scripts/build-app.sh
      - name: Smoke test
        run: scripts/smoke-test.sh "dist/Stage One.app"
      - uses: actions/upload-artifact@v4
        with:
          name: StageOne-dmg
          path: |
            dist/*.dmg
            dist/*.alfredworkflow
