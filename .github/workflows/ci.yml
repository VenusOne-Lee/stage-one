name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app and DMG
        run: |
          VERSION="0.1.0-dev.${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          VERSION="$VERSION" scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StageOne-dmg
          path: dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/*.dmg --generate-notes --prerelease
